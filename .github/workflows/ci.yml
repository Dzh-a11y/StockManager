name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 手动触发:在 Actions 页点 "Run workflow" 即可构建并下载 exe

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline UI tests (no npm dependencies)
        run: node --test code/tests/frontend/*.test.cjs

  # 1) 三平台自动测试:每次推送都验证 Windows/macOS/Linux 都能安装依赖并跑通测试。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project (incl. baostock/pandas<3/tzdata/backtrader)
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  # 2) Windows 云端构建单文件 exe:GitHub 的 windows-runner 上装依赖并打包。
  #    产物 exe 已内嵌全部依赖(含 backtrader 回测引擎),下载后在任意 Windows
  #    机器直接双击即可运行,无需在本机安装 Python 或任何依赖。
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (wheel-only, 避免源码编译)
        run: |
          python -m pip install --only-binary=:all: "pandas<3" baostock tzdata pyinstaller
          # 回测引擎依赖:必须装进打包环境,否则 exe 运行时 "No module named backtrader"。
          python -m pip install "backtrader>=1.9.78.123"
      - name: Verify backtrader is importable
        run: python -c "import backtrader; print('backtrader', backtrader.__version__)"
      - name: Build onefile exe
        run: |
          # --collect-submodules backtrader:强制收集 backtrader 全部子模块,
          # 避免其 from ... import * 通配导入在 PyInstaller 静态分析里被漏掉。
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name StockManager --paths "src" --collect-submodules backtrader --add-data "config\rule_templates;config\rule_templates" --add-data "config\sync.json;config" --add-data "src\stock_manager\web\static;src\stock_manager\web\static" scripts\exe_entry.py
      - name: Smoke test (run exe, must import backtrader & exit 0)
        shell: pwsh
        run: |
          $env:STOCK_MANAGER_SMOKE_CHECK = "1"
          $exe = Join-Path $env:GITHUB_WORKSPACE "code\dist\StockManager.exe"
          $p = Start-Process -FilePath $exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe smoke test failed: exit code $($p.ExitCode)" }
          Write-Output "exe smoke test passed (backtrader importable)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockManager-windows-exe
          path: code/dist/StockManager.exe
          if-no-files-found: error
