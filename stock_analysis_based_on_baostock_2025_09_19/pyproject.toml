[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-manager"
version = "1.1.2"
description = "A testable research-oriented A-share stock screening core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["baostock>=0.8.9"]

[project.scripts]
stock-manager = "stock_manager.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
